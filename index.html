<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellyfish</title>
    <style>
        body {
            background-color: rgb(22, 21, 21);
            font-family: Arial, sans-serif;
            /* border: 1px solid red; */
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100vh;
            color: white;
        }
        img {
            position: absolute;
            width: 50px;
            height: 50px;
            animation-duration: 10s;
            animation-name: slide-in;
            animation-iteration-count: infinite;
            animation-direction: normal;
        }
        h1 {
            padding: 0px;
            margin: 0px;
        }
        div {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .bubble {
            width: 10px;
            height: 10px;
            border: 1px solid white;
            border-radius: 50%;

            animation-duration: 2s;
            animation-name: bubble-side-to-side;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-timing-function: linear;
        }
        .bubble-wrapper {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;

            animation-duration: 15s;
            animation-name: bubble-up;
            animation-iteration-count: infinite;
            animation-direction: normal;
            animation-timing-function: linear;
        }
        @keyframes bubble-up {
            0% {
                translate: 0 100vh;
            }
            100% {
                translate: 0 -100vh;
            }
        }

        @keyframes bubble-side-to-side {
            from {
                translate: 5vw 0;
            }
            to {
                translate: -5vw 0;
            }
        }



        img:hover {
            animation-play-state: paused;
        }

        @keyframes slide-in {
            0% {
                translate: 100vw 100vh;
            }

            25% {
                translate: 75vw 85vh;
            }

            50% {
                translate: 50vw 50vh;
            }

            75% {
                translate: 25vw 35vh;
            }

            90% {
                translate: 10vw 10vh;
            }

            100% {
                translate: -10vw 0;
            }
        }
    </style>
</head>
<body>
    <div>
        <h1>Jellyfish Aquarium</h1>
    </div>
    <div class="bubble-wrapper">
        <div class="bubble" ></div>
    </div>
    <div class="bubble-wrapper" style="left: 100px; top: 100px; animation-duration: 12s;">
        <div class="bubble" ></div>
    </div>
    <div class="bubble-wrapper" style="left: -100px; top: 300px; animation-duration: 20s;">
        <div class="bubble" ></div>
    </div>
    <div class="bubble-wrapper" style="left: -50px; top: 200px; animation-duration: 10s;">
        <div class="bubble" ></div>
    </div>
    <img 
        src="autodraw 12_6_2025.png" 
        alt="Random Image" 
     >
     <img 
        src="autodraw 12_6_2025.png" 
        alt="Random Image" 
     >
    <script src="script.js"></script>
</body>
</html>
