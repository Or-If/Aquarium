<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellyfish</title>
    <style>
        body {
            background-color: rgb(22, 21, 21);
            font-family: Arial, sans-serif;
            /* border: 1px solid red; */
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100dvh;
            color: white;
        }
        img {
            width: 50px;
            height: 50px;
            animation-duration: 10s;
            animation-name: slide-in;
            animation-iteration-count: infinite;
            animation-direction: normal;
        }

        img:hover {
            animation-play-state: paused;
        }

        @keyframes slide-in {
            0% {
                translate: 100vw 100vh;
            }

            25% {
                translate: 75vw 85vh;
            }

            50% {
                translate: 50vw 50vh;
            }

            75% {
                translate: 25vw 35vh;
            }

            90% {
                translate: 10vw 10vh;
            }

            100% {
                translate: -10vw 0;
            }
        }
    </style>
</head>
<body>
    <!-- <h1>Hello World</h1> -->
    <img 
        src="autodraw 12_6_2025.png" 
        alt="Random Image" 
     >
    <script src="script.js"></script>
    <style></style>
</body>
</html>
